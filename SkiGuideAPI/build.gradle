plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.dasumma1'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-neo4j'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.apache.jena:jena-fuseki-main:4.10.0'
	implementation 'org.apache.jena:jena-arq:4.10.0'
	implementation 'org.apache.jena:jena-tdb2:4.10.0'
	implementation 'io.micrometer:micrometer-registry-prometheus:1.11.10'
	implementation('org.apache.jena:jena-fuseki-main:4.10.0') {
		exclude group: 'org.slf4j', module: 'slf4j-simple'
	}
	runtimeOnly 'javax.servlet:javax.servlet-api:3.1.0'
	implementation 'org.eclipse.jetty:jetty-server:9.4.49.v20220914'
	implementation 'org.eclipse.jetty:jetty-servlet:9.4.49.v20220914'
	implementation 'org.eclipse.jetty:jetty-security:9.4.49.v20220914'
	implementation 'org.eclipse.jetty:jetty-util:9.4.49.v20220914'
	implementation 'org.eclipse.jetty:jetty-http:9.4.49.v20220914'
	implementation 'org.eclipse.jetty:jetty-io:9.4.49.v20220914'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-neo4j-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.all {
	resolutionStrategy {
		// Force consistent versions for common transitive libraries used by Spring Boot and Jena
		force 'org.slf4j:slf4j-api:2.0.9'
		force 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
		force 'com.fasterxml.jackson.core:jackson-core:2.15.2'
		force 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
